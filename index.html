<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>安真魔法學院</title>
<meta name="description" content="安真魔法學院：音樂教室、語文教室，用闖關的方式複習。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;700;900&family=Huninn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/academy.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23F0604D' stroke='%23222' stroke-width='7'/><text x='50' y='69' font-size='54' font-weight='900' text-anchor='middle' fill='white' font-family='PingFang TC,Microsoft JhengHei,sans-serif'>安</text></svg>">
<style>
  .hero { text-align: center; padding: 18px 0 26px; }
  .hero .l1 { display: block; font-family: var(--hand); font-size: clamp(1.1rem, 3.8vw, 1.45rem); color: var(--ink-2); }
  .hero h1 { margin: 12px 0 0; font-size: clamp(2.1rem, 9vw, 3.6rem); }
  .hero .l3 { margin-top: 18px; background: var(--sky); font-family: var(--hand); font-weight: 400; font-size: 1.05rem; }
  .logo { position: relative; display: inline-grid; place-items: center; width: 112px; height: 112px; margin-bottom: 14px; border-radius: 50%;
    background: var(--pink); border: 4px solid var(--ink); box-shadow: 5px 5px 0 var(--ink);
    font-family: var(--hand); font-size: 64px; line-height: 1; color: #fff; text-shadow: 3px 3px 0 var(--ink);
    animation: logoBob 3s ease-in-out infinite; }
  .logo::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 3px dashed rgba(255, 255, 255, .7); }
  .logo .spark { position: absolute; font-size: 26px; text-shadow: none; animation: twinkle 1.6s ease-in-out infinite; }
  .logo .s1 { top: -10px; right: -12px; } .logo .s2 { bottom: 2px; left: -18px; font-size: 20px; animation-delay: -.8s; }
  @keyframes logoBob { 50% { transform: translateY(-6px) rotate(-3deg); } }
  @keyframes twinkle { 50% { transform: scale(.6) rotate(20deg); opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { .logo, .logo .spark { animation: none; } }

  .doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 22px; }
  .door {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 30px 20px 22px; border-radius: 130px 130px 22px 22px;
    border: var(--bd); box-shadow: 6px 6px 0 var(--ink); text-decoration: none; color: var(--ink);
    transition: transform .12s, box-shadow .12s;
  }
  a.door:hover { transform: translate(-2px, -3px) rotate(-.6deg); box-shadow: 8px 9px 0 var(--ink); }
  a.door:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
  .door .icon { display: grid; place-items: center; width: 92px; height: 92px; border-radius: 50%; background: #fff; border: var(--bd); box-shadow: 3px 3px 0 var(--ink); font-size: 50px; line-height: 1; }
  .door h2 { margin: 14px 0 2px; font-family: var(--hand); font-weight: 400; font-size: 1.9rem; }
  .door .sub { display: inline-block; margin-top: 2px; background: #fff; border: 2.5px solid var(--ink); border-radius: 999px; padding: 0 12px; font-weight: 900; font-size: .95rem; }
  .door ul { list-style: none; padding: 0; margin: 14px 0 18px; display: grid; gap: 6px; width: 100%; }
  .door li { background: rgba(255, 255, 255, .75); border: 2px solid var(--ink); border-radius: 10px; padding: 3px 8px; font-weight: 700; font-size: .95rem; }
  .door .enter { margin-top: auto; display: inline-flex; padding: 9px 22px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 900; box-shadow: 3px 3px 0 rgba(0,0,0,.25); }
  .door.music { background: var(--lemon); }
  .door.lang { background: var(--mint); }
  .door.lang h2, .door.lang .enter { color: #fff; }
  .door.lang h2 { text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink); }
  .door.soon { background: var(--grape); }
  .door.soon h2 { color: #fff; text-shadow: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink); }
  .door.soon .enter { background: #fff; color: var(--ink-2); border: 2.5px solid var(--ink); box-shadow: none; }

  .foot { margin-top: 34px; text-align: center; }

  /* 推門動畫 */
  a.door { position: relative; overflow: hidden; perspective: 900px; isolation: isolate; }
  .door .glow, .door .leaf { position: absolute; pointer-events: none; opacity: 0; }
  .door .glow { inset: 0; z-index: 2; transition: opacity .18s ease; display: grid; place-items: center; font-size: 56px;
    background: radial-gradient(circle at 50% 45%, #fff 0%, #FFF4B8 35%, #FFD45C 70%, #F6A33A 100%); }
  .door .glow span { animation: twinkle 1s ease-in-out infinite; }
  .door .leaf { top: 0; bottom: 0; width: 50%; z-index: 3; background: inherit;
    transition: transform .75s cubic-bezier(.55, .05, .3, 1), opacity .18s ease; backface-visibility: hidden; }
  .door .leaf::before { content: ""; position: absolute; left: 16%; right: 16%; top: 22%; height: 26%; border: 3px solid var(--ink); border-radius: 14px; background: rgba(255, 255, 255, .28); }
  .door .leaf::after { content: ""; position: absolute; left: 16%; right: 16%; top: 56%; height: 30%; border: 3px solid var(--ink); border-radius: 14px; background: rgba(255, 255, 255, .28); }
  .door .leaf.l { left: 0; border-right: 3px solid var(--ink); transform-origin: 0 50%; }
  .door .leaf.r { right: 0; border-left: 3px solid var(--ink); transform-origin: 100% 50%; }
  .door .knob { position: absolute; top: 52%; width: 16px; height: 16px; border-radius: 50%; background: var(--lemon); border: 3px solid var(--ink); }
  .door .leaf.l .knob { right: 10px; } .door .leaf.r .knob { left: 10px; }
  a.door.opening { transform: none; box-shadow: 6px 6px 0 var(--ink); }
  a.door.opening .glow, a.door.opening .leaf { opacity: 1; }
  a.door.open .leaf.l { transform: rotateY(-108deg); }
  a.door.open .leaf.r { transform: rotateY(108deg); }
  a.door.open { animation: doorZoom .9s .3s ease-in forwards; z-index: 5; }
  @keyframes doorZoom { to { transform: scale(1.12); } }
  .flash { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at var(--fx, 50%) var(--fy, 50%), #fff 0%, #FFF6C8 45%, #FFE07A 100%); }
  body.entering .flash { animation: flashIn .45s .5s ease-in forwards; }
  @keyframes flashIn { to { opacity: 1; } }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="home" href="./"><span class="badge" aria-hidden="true">安</span><span class="txt">安真魔法學院</span></a>
  <div class="tb-actions">
    <button class="tb-btn" id="refreshBtn" type="button" aria-label="更新網頁到最新版"><span class="ico">🔄</span>更新</button>
  </div>
</div></header>

<main class="wrap">
  <section class="hero">
    <div class="logo" role="img" aria-label="安真魔法學院校徽：安">安<span class="spark s1" aria-hidden="true">⭐</span><span class="spark s2" aria-hidden="true">✨</span></div>
    <span class="l1">推開一扇門，就開始一場學習冒險！</span>
    <h1 class="tiles" aria-label="安真魔法學院"><b class="tile">安</b><b class="tile">真</b><b class="tile">魔</b><b class="tile">法</b><b class="tile">學</b><b class="tile">院</b></h1>
    <span class="pill l3">每天練一點點，魔力就多一點點 ✨</span>
  </section>

  <section class="doors" aria-label="教室">
    <a class="door music" href="https://laierin615.github.io/romantic-music-ebook/">
      <span class="icon" aria-hidden="true">🎻</span>
      <h2>音樂教室</h2>
      <span class="sub">浪漫樂派大冒險</span>
      <ul>
        <li>🐾 黑貓老師翻頁電子書</li>
        <li>🎬 四格漫畫・🔔 鐘琴示範曲</li>
        <li>📝 闖關小考・🧠 記憶翻牌</li>
      </ul>
      <span class="enter">推門進去 →</span>
    </a>

    <a class="door lang" href="language/">
      <span class="icon" aria-hidden="true">📜</span>
      <h2>語文教室</h2>
      <span class="sub">字音字形咒語特訓</span>
      <ul>
        <li>🏆 全國語文競賽國小組歷屆題</li>
        <li>🔤 字音・✍️ 字形翻牌練習</li>
        <li>📕 錯題本自動收集</li>
      </ul>
      <span class="enter">推門進去 →</span>
    </a>

    <div class="door soon" aria-disabled="true">
      <span class="icon" aria-hidden="true">🔮</span>
      <h2>神祕教室</h2>
      <span class="sub">籌備中</span>
      <ul><li>下一間教室，敬請期待</li></ul>
      <span class="enter">即將開放</span>
    </div>
  </section>

  <p class="foot"><span class="pill">✦ 安真魔法學院 ✦</span></p>
</main>
<div class="flash" aria-hidden="true"></div>
<script>
  // 推門進去：兩片門板往內打開，透出金光，畫面亮起後進教室
  (function () {
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var doors = document.querySelectorAll('a.door');
    doors.forEach(function (a) {
      var g = document.createElement('span'); g.className = 'glow'; g.setAttribute('aria-hidden', 'true'); g.innerHTML = '<span>✨</span>';
      var l = document.createElement('span'); l.className = 'leaf l'; l.setAttribute('aria-hidden', 'true'); l.innerHTML = '<i class="knob"></i>';
      var r = document.createElement('span'); r.className = 'leaf r'; r.setAttribute('aria-hidden', 'true'); r.innerHTML = '<i class="knob"></i>';
      a.appendChild(g); a.appendChild(l); a.appendChild(r);
      a.addEventListener('click', function (e) {
        if (reduce || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        if (a.classList.contains('opening')) return;
        var box = a.getBoundingClientRect();
        document.documentElement.style.setProperty('--fx', (box.left + box.width / 2) + 'px');
        document.documentElement.style.setProperty('--fy', (box.top + box.height / 2) + 'px');
        a.classList.add('opening');
        setTimeout(function () { a.classList.add('open'); document.body.classList.add('entering'); }, 230);
        setTimeout(function () { location.href = a.href; }, 1280);
      });
    });
    // 從教室按「上一頁」回來時，把門關好
    window.addEventListener('pageshow', function () {
      document.body.classList.remove('entering');
      doors.forEach(function (a) { a.classList.remove('opening', 'open'); });
    });
  })();
</script>
<script src="assets/academy.js"></script>
</body>
</html>
